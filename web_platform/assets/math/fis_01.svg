<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <marker id="forceArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="weightArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="normalArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="thrustArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="500" height="320" rx="14" fill="url(#fisBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Suelo horizontal -->
  <line x1="40" y1="240" x2="460" y2="240" stroke="#475569" stroke-width="2" />
  <!-- Plano Inclinado ángulo θ = 30° -->
  <polygon points="60,240 380,240 380,80" fill="rgba(212, 175, 55, 0.08)" stroke="#d4af37" stroke-width="2" />

  <!-- Ángulo theta en (60, 240) -->
  <path d="M 120,240 A 60 60 0 0 0 112,214" fill="none" stroke="#fbbf24" stroke-width="2" />
  <text x="125" y="232" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">θ = 30°</text>

  <!-- Bloque / Vehículo Táctico sobre el plano inclinado (rotado 30°) -->
  <!-- Centro del bloque aprox (220, 160) -->
  <g transform="translate(220, 160) rotate(-26.56)">
    <!-- Cuerpo del bloque -->
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="5" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">m = 2500 kg</text>

    <!-- Normal N perpendicular hacia arriba (en eje local Y negativo) -->
    <line x1="0" y1="-30" x2="0" y2="-95" stroke="#34d399" stroke-width="3" marker-end="url(#normalArrow)" />
    <text x="12" y="-85" fill="#34d399" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">N</text>

    <!-- Fuerza de tracción hacia arriba del plano -->
    <line x1="40" y1="0" x2="110" y2="0" stroke="#fbbf24" stroke-width="3" marker-end="url(#thrustArrow)" />
    <text x="80" y="-12" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">F = 7500 N</text>

    <!-- Fricción hacia abajo del plano -->
    <line x1="-40" y1="0" x2="-90" y2="0" stroke="#f472b6" stroke-width="2.5" marker-end="url(#forceArrow)" />
    <text x="-85" y="-10" fill="#f472b6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">f_k</text>

    <!-- Peso P = mg vertical hacia abajo del mundo (rotado en sentido opuesto) -->
    <g transform="rotate(26.56)">
      <line x1="0" y1="0" x2="0" y2="85" stroke="#f87171" stroke-width="3" marker-end="url(#weightArrow)" />
      <text x="10" y="75" fill="#f87171" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">P = mg</text>
    </g>
  </g>

  <!-- Leyenda técnica -->
  <rect x="330" y="255" width="150" height="50" rx="6" fill="rgba(15,23,42,0.85)" stroke="#334155" />
  <text x="340" y="275" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ΣF = m · a</text>
  <text x="340" y="293" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Dinámica en Plano Inclinado</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="circBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#151e36" />
    </linearGradient>
    <radialGradient id="quadGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="rgba(212, 175, 55, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="500" height="320" rx="14" fill="url(#circBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ejes Cartesianos X e Y centrados en (230, 160) -->
  <!-- Eje X -->
  <line x1="60" y1="160" x2="400" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="410" y="165" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">X</text>

  <!-- Eje Y -->
  <line x1="230" y1="280" x2="230" y2="40" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="235" y="35" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">Y</text>

  <!-- Circunferencia Trigonométrica Radio R = 100 -->
  <circle cx="230" cy="160" r="100" fill="url(#quadGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Radio Vector Terminal en θ = 53° (cos=0.6, sin=0.8) -> dx=60, dy=-80 -> P(290, 80) -->
  <line x1="230" y1="160" x2="290" y2="80" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowGold)" />

  <!-- Proyección Seno (Vertical) P(290,80) a (290,160) -->
  <line x1="290" y1="80" x2="290" y2="160" stroke="#34d399" stroke-width="2.5" stroke-dasharray="3,3" />

  <!-- Proyección Coseno (Horizontal) (230,160) a (290,160) -->
  <line x1="230" y1="160" x2="290" y2="160" stroke="#38bdf8" stroke-width="3" />

  <!-- Arco de Ángulo θ -->
  <path d="M 265,160 A 35 35 0 0 0 251,132" fill="none" stroke="#f59e0b" stroke-width="2" />
  <text x="268" y="145" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">θ</text>

  <!-- Punto P(x, y) -->
  <circle cx="290" cy="80" r="5" fill="#fbbf24" stroke="#fff" stroke-width="1.5" />
  <text x="300" y="75" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">P(cos θ, sen θ)</text>

  <!-- Etiquetas sen θ y cos θ -->
  <text x="298" y="125" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" font-weight="700">sen θ = 0.8</text>
  <text x="240" y="180" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">cos θ = 0.6</text>

  <!-- Radio R = 1 -->
  <text x="240" y="110" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">R = 1</text>

  <!-- Leyenda informativa -->
  <rect x="350" y="220" width="130" height="70" rx="6" fill="rgba(15,23,42,0.85)" stroke="#334155" />
  <text x="360" y="240" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">■ cos θ (Eje X)</text>
  <text x="360" y="260" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">■ sen θ (Eje Y)</text>
  <text x="360" y="280" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold">■ R² = cos² + sen²</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo sutil -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <!-- Gradiente de relleno del triángulo -->
    <linearGradient id="triGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.15)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.05)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="500" height="320" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cuadrícula sutil técnica -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="40" x2="50" y2="280" />
    <line x1="150" y1="40" x2="150" y2="280" />
    <line x1="250" y1="40" x2="250" y2="280" />
    <line x1="350" y1="40" x2="350" y2="280" />
    <line x1="450" y1="40" x2="450" y2="280" />
    <line x1="40" y1="80" x2="460" y2="80" />
    <line x1="40" y1="150" x2="460" y2="150" />
    <line x1="40" y1="220" x2="460" y2="220" />
  </g>

  <!-- Triángulo Rectángulo ABC (Recto en B) -->
  <!-- Vértice A: (80, 240), B: (80, 70), C: (380, 240) -->
  <polygon points="80,240 80,70 380,240" fill="url(#triGrad)" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Símbolo de Ángulo Recto en B (80, 240) -->
  <path d="M 80,215 L 105,215 L 105,240" fill="none" stroke="#fbbf24" stroke-width="2" />
  <circle cx="92" cy="227" r="2.5" fill="#fbbf24" />

  <!-- Altura relativa a la hipotenusa BH (desde B(80,240) proyectada sobre AC) -->
  <!-- Vector AC: (300, -170) -> Proyección ortogonal H aprox (153, 198) -->
  <line x1="80" y1="240" x2="153" y2="198" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" />
  <!-- Recto en H -->
  <path d="M 143,204 L 149,214 L 159,208" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Arco de Ángulo Alfa en C (380, 240) -->
  <path d="M 330,240 A 50 50 0 0 0 342,218" fill="none" stroke="#34d399" stroke-width="2.5" />
  <text x="315" y="228" fill="#34d399" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="bold">α</text>

  <!-- Arco de Ángulo Beta en A (80, 70) -->
  <path d="M 80,105 A 35 35 0 0 0 102,96" fill="none" stroke="#f472b6" stroke-width="2.5" />
  <text x="108" y="112" fill="#f472b6" font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="bold">β</text>

  <!-- Etiquetas de los Vértices -->
  <circle cx="80" cy="70" r="5" fill="#d4af37" />
  <text x="60" y="65" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">A</text>

  <circle cx="80" cy="240" r="5" fill="#d4af37" />
  <text x="55" y="258" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">B (90°)</text>

  <circle cx="380" cy="240" r="5" fill="#d4af37" />
  <text x="395" y="248" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold">C</text>

  <circle cx="153" cy="198" r="4" fill="#38bdf8" />
  <text x="145" y="183" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">H</text>

  <!-- Dimensiones y Variables Matemáticas -->
  <!-- Cateto AB = c -->
  <text x="45" y="160" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="600">c</text>

  <!-- Cateto BC = a -->
  <text x="230" y="268" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="600">a</text>

  <!-- Hipotenusa AC = b -->
  <text x="245" y="135" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="16" font-weight="700">b = 25 cm</text>

  <!-- Altura h -->
  <text x="96" y="210" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="600">h = 12</text>

  <!-- Nota de referencia inferior -->
  <rect x="130" y="288" width="240" height="24" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="250" y="304" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">
    Relaciones Métricas en el Triángulo ABC
  </text>
</svg>
